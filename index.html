    // Datums- & Formatierungshelfer (lokale Zeitzone)
    function startOfDay(date = new Date()) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate());
    }

    function addDays(baseDate, deltaDays) {
      const d = new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate());
      d.setDate(d.getDate() + Number(deltaDays));
      return d;
    }

    function toIsoDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function parseIsoDate(isoStr) {
      if (!isoStr || typeof isoStr !== 'string') return null;
      const parts = isoStr.trim().split('-');
      if (parts.length !== 3) return null;
      const y = Number(parts[0]);
      const m = Number(parts[1]) - 1;
      const d = Number(parts[2]);
      const date = new Date(y, m, d);
      if (date.getFullYear() !== y || date.getMonth() !== m || date.getDate() !== d) return null;
      return date;
    }

    function formatGermanDate(isoOrDate) {
      const d = typeof isoOrDate === 'string' ? parseIsoDate(isoOrDate) : isoOrDate;
      if (!d || isNaN(d.getTime())) return '–';
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const year = d.getFullYear();
      return `${day}.${month}.${year}`;
    }

    function formatDateTimeGerman(date = new Date()) {
      const datePart = formatGermanDate(date);
      const hh = String(date.getHours()).padStart(2, '0');
      const mm = String(date.getMinutes()).padStart(2, '0');
      return `${datePart}, ${hh}:${mm} Uhr`;
    }

    function formatCurrency(amount) {
      const num = Number(amount) || 0;
      return num.toLocaleString('de-DE', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }) + ' €';
    }

    function parseGermanCurrency(raw) {
      if (typeof raw === 'number') return isFinite(raw) ? raw : NaN;
      if (!raw) return NaN;
      let cleaned = String(raw).replace(/€/g, '').replace(/\s+/g, '').trim();
      if (!cleaned) return NaN;
      if (!cleaned.includes(',') && /^\d{1,3}(\.\d{3})+$/.test(cleaned)) {
        cleaned = cleaned.replace(/\./g, '');
      }
      if (cleaned.includes(',')) {
        cleaned = cleaned.replace(/\./g, '').replace(',', '.');
      } else if ((cleaned.match(/\./g) || []).length > 1) {
        cleaned = cleaned.replace(/\./g, '');
      }
      const val = Number(cleaned);
      return isFinite(val) ? val : NaN;
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getDiffDaysFromToday(dueDateIso) {
      const due = parseIsoDate(dueDateIso);
      if (!due) return 0;
      const today = startOfDay(new Date());
      const msPerDay = 1000 * 60 * 60 * 24;
      return Math.round((due.getTime() - today.getTime()) / msPerDay);
    }

    function getInvoiceStatus(invoice) {
      if (invoice.paid) {
        return {
          key: 'paid',
          label: 'Bezahlt',
          badgeClass: 'bg-emerald-50 text-emerald-800 border-emerald-200',
          dotClass: 'bg-emerald-600'
        };
      }
      const diff = getDiffDaysFromToday(invoice.dueDate);
      if (diff < 0) {
        return {
          key: 'overdue',
          label: 'Überfällig',
          badgeClass: 'bg-red-50 text-red-800 border-red-200',
          dotClass: 'bg-red-600'
        };
      }
      if (diff <= 3) {
        return {
          key: 'soon',
          label: 'Bald fällig',
          badgeClass: 'bg-amber-50 text-amber-900 border-amber-200',
          dotClass: 'bg-amber-500'
        };
      }
      return {
        key: 'open',
        label: 'Offen',
        badgeClass: 'bg-blue-50 text-blue-800 border-blue-200',
        dotClass: 'bg-blue-600'
      };
    }

    function evaluateReminderPlanForInvoice(invoice, stages) {
      const diff = getDiffDaysFromToday(invoice.dueDate);
      const activeStages = [...stages]
        .filter(s => s.enabled && !(s.timingType === 'before' && diff < 0))
        .map(s => {
          const offset = Math.max(0, Number(s.daysOffset) || 0);
          const targetDiff = s.timingType === 'before' ? offset : -offset;
          return { ...s, offset, targetDiff };
        })
        .sort((a, b) => b.targetDiff - a.targetDiff);

      if (invoice.paid) {
        return {
          nextStage: null,
          dueNow: false,
          label: 'Erledigt (bezahlt)',
          urgencyScore: 999
        };
      }

      if (activeStages.length === 0) {
        return {
          nextStage: null,
          dueNow: false,
          label: 'Kein aktiver Schritt',
          urgencyScore: 500
        };
      }

      const candidateDue = activeStages.find(
        st => diff <= st.targetDiff && st.id > (invoice.lastReminderStep || 0)
      );

      if (candidateDue) {
        return {
          nextStage: candidateDue,
          dueNow: true,
          label: `Stufe ${candidateDue.id} jetzt fällig`,
          urgencyScore: diff - 20
        };
      }

      const upcoming = activeStages.find(st => st.id > (invoice.lastReminderStep || 0));
      if (upcoming) {
        const daysUntilTrigger = diff - upcoming.targetDiff;
        if (daysUntilTrigger <= 0) {
          return {
            nextStage: upcoming,
            dueNow: true,
            label: `Stufe ${upcoming.id} fällig`,
            urgencyScore: diff - 10
          };
        }
        if (daysUntilTrigger === 1) {
          return {
            nextStage: upcoming,
            dueNow: false,
            label: `Stufe ${upcoming.id} morgen`,
            urgencyScore: diff + daysUntilTrigger
          };
        }
        return {
          nextStage: upcoming,
          dueNow: false,
          label: `Stufe ${upcoming.id} in ${daysUntilTrigger} Tagen`,
          urgencyScore: diff + daysUntilTrigger
        };
      }

      return {
        nextStage: activeStages[activeStages.length - 1],
        dueNow: false,
        label: `Alle ${stages.filter(s => s.enabled).length} Stufen simuliert`,
        urgencyScore: diff + 50
      };
    }

    function renderTemplate(templateStr, invoice, companyName = DEFAULT_COMPANY_NAME) {
      const replacements = {
        '{Kunde}': invoice.customer || 'Kunde',
        '{Rechnungsnummer}': invoice.invoiceNumber || 'RE-000',
        '{Betrag}': formatCurrency(invoice.amount),
        '{Fälligkeitsdatum}': formatGermanDate(invoice.dueDate),
        '{Firmenname}': companyName
      };
      let out = String(templateStr || '');
      for (const [key, val] of Object.entries(replacements)) {
        out = out.split(key).join(val);
      }
      return out;
    }

    function loadState() {
      try {
        const todayKey = toIsoDate(startOfDay(new Date()));
        if (localStorage.getItem('zahlungslotse_demo_day_v2') !== todayKey) {
          localStorage.removeItem(STORAGE_KEYS.INVOICES);
          localStorage.removeItem(STORAGE_KEYS.ACTIVITY);
          localStorage.setItem('zahlungslotse_demo_day_v2', todayKey);
        }

        const rawInv = localStorage.getItem(STORAGE_KEYS.INVOICES);
        if (rawInv) {
          const parsed = JSON.parse(rawInv);
          if (Array.isArray(parsed)) state.invoices = parsed;
        }
        if (!state.invoices.length) {
          state.invoices = createSampleInvoices();
          localStorage.setItem(STORAGE_KEYS.INVOICES, JSON.stringify(state.invoices));
        }

        const rawStages = localStorage.getItem(STORAGE_KEYS.STAGES);
        if (rawStages) {
          const parsed = JSON.parse(rawStages);
          if (Array.isArray(parsed) && parsed.length === 3) state.stages = parsed;
        }
        if (!state.stages.length) {
          state.stages = createDefaultStages();
          localStorage.setItem(STORAGE_KEYS.STAGES, JSON.stringify(state.stages));
        }

        const rawAct = localStorage.getItem(STORAGE_KEYS.ACTIVITY);
        if (rawAct) {
          const parsed = JSON.parse(rawAct);
          if (Array.isArray(parsed)) state.activity = parsed;
        }
        if (!state.activity.length) {
          state.activity = createSampleActivity(state.invoices);
          localStorage.setItem(STORAGE_KEYS.ACTIVITY, JSON.stringify(state.activity));
        }

        const rawSignals = localStorage.getItem(STORAGE_KEYS.SIGNALS);
        if (rawSignals) {
          const parsed = JSON.parse(rawSignals);
          if (Array.isArray(parsed)) state.signals = parsed;
        }
      } catch (err) {
        console.error('Fehler beim Laden des Demo-Zustands:', err);
        state.invoices = createSampleInvoices();
        state.stages = createDefaultStages();
        state.activity = createSampleActivity(state.invoices);
        state.signals = [];
      }
    }

    // Kennzahlen & Dringlichkeitsliste
    function computeKpis() {
      const today = startOfDay(new Date());
      const currentMonth = today.getMonth();
      const currentYear = today.getFullYear();

      let openTotal = 0;
      let overdueTotal = 0;
      let dueTodayCount = 0;
      let paidThisMonthTotal = 0;

      for (const inv of state.invoices) {
        const amt = Number(inv.amount) || 0;
        if (inv.paid) {
          const paidDate = parseIsoDate(inv.paidDate) || parseIsoDate(inv.dueDate) || today;
          if (paidDate.getMonth() === currentMonth && paidDate.getFullYear() === currentYear) {
            paidThisMonthTotal += amt;
          }
        } else {
          openTotal += amt;
          const diff = getDiffDaysFromToday(inv.dueDate);
          if (diff < 0) overdueTotal += amt;
          if (diff === 0) dueTodayCount += 1;
        }
      }

      return { openTotal, overdueTotal, dueTodayCount, paidThisMonthTotal };
    }

    function getUrgentInvoices(limit = 5) {
      return state.invoices
        .filter(inv => !inv.paid)
        .map(inv => {
          const status = getInvoiceStatus(inv);
          const planEval = evaluateReminderPlanForInvoice(inv, state.stages);
          const diff = getDiffDaysFromToday(inv.dueDate);
          return { inv, status, planEval, diff };
        })
        .sort((a, b) => a.planEval.urgencyScore - b.planEval.urgencyScore)
        .slice(0, limit);
    }

      const errors = [];
      if (!customer) errors.push('Bitte einen Kundennamen angeben.');
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        errors.push('Bitte eine gültige E-Mail-Adresse eingeben.');
      }
      if (!invoiceNumber) errors.push('Bitte eine Rechnungsnummer angeben.');

      const amount = parseGermanCurrency(amountRaw);
      if (isNaN(amount) || amount <= 0) {
        errors.push('Der Betrag muss größer als 0,00 € sein.');

      const issueDate = parseIsoDate(issueDateStr);
      const dueDate = parseIsoDate(dueDateStr);
      if (!issueDate) errors.push('Bitte ein gültiges Rechnungsdatum angeben.');
      if (!dueDate) errors.push('Bitte ein gültiges Fälligkeitsdatum angeben.');
      if (issueDate && dueDate && dueDate.getTime() < issueDate.getTime()) {

        `RE-2026-2003;Unvollstaendiger Datensatz (Test);ungueltig-mail;0;${d3Issue};${d3Due}`
      ].join('\n');

    function splitCsvLine(line, delimiter) {
      const out = [];
      let cur = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') {
            cur += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === delimiter && !inQuotes) {
          out.push(cur.trim());
          cur = '';
        } else {
          cur += ch;
        }
      }
      out.push(cur.trim());
      return out;
    }

    function parseCsvAndBuildPreview(csvText) {
      const lines = csvText
        .split(/\r?\n/)
        .map(l => l.trim())
        .filter(l => l.length > 0);

      if (lines.length === 0) return [];

      const delimiter = lines[0].includes(';') ? ';' : ',';
      const firstCols = lines[0].split(delimiter).map(c => c.trim().toLowerCase());
      const hasHeader = firstCols.some(c => c.includes('rechnungs') || c.includes('kunde') || c.includes('betrag'));
      const dataLines = hasHeader ? lines.slice(1) : lines;

      function parseFlexibleDate(val) {
        if (!val) return null;
        if (/^\d{4}-\d{2}-\d{2}$/.test(val)) return parseIsoDate(val);
        if (/^\d{2}\.\d{2}\.\d{4}$/.test(val)) {
          const [dd, mm, yyyy] = val.split('.');
          return parseIsoDate(`${yyyy}-${mm}-${dd}`);
        }
        return null;
      }

      return dataLines.map((line, idx) => {
        const rowNum = hasHeader ? idx + 2 : idx + 1;
        const cols = splitCsvLine(line, delimiter);

        const invoiceNumber = cols[0] || '';
        const customer = cols[1] || '';
        const email = cols[2] || '';
        const amountStr = cols[3] || '';
        const issueStr = cols[4] || '';
        const dueStr = cols[5] || '';

        const issues = [];
        if (!invoiceNumber) issues.push('Rechnungsnummer fehlt');
        if (!customer) issues.push('Kunde fehlt');
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) issues.push('E-Mail ungültig');
        const amount = parseGermanCurrency(amountStr);
        if (isNaN(amount) || amount <= 0) issues.push('Betrag muss > 0 sein');

        const issueDate = parseFlexibleDate(issueStr);
        const dueDate = parseFlexibleDate(dueStr);
        if (!issueDate) issues.push('Rechnungsdatum ungültig');
        if (!dueDate) issues.push('Fälligkeitsdatum ungültig');
        if (issueDate && dueDate && dueDate.getTime() < issueDate.getTime()) {
          issues.push('Fälligkeit vor Rechnungsdatum');
        }

        return {
          rowNum,
          invoiceNumber,
          customer,
          email,
          amount: isNaN(amount) ? 0 : amount,
          issueDateIso: issueDate ? toIsoDate(issueDate) : '',
          dueDateIso: dueDate ? toIsoDate(dueDate) : '',
          valid: issues.length === 0,
          issues
        };
      });
    }

    function handleCsvFileSelected(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      state.csvFileName = file.name;
      const reader = new FileReader();
      reader.onload = (e) => {
        const bytes = new Uint8Array(e.target.result);
        let text;
        try {
          text = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
        } catch (err) {
          text = new TextDecoder('windows-1252').decode(bytes);
        }
        state.csvPreviewRows = parseCsvAndBuildPreview(text.replace(/^\uFEFF/, ''));
        renderCsvModalBody();
      };
      reader.readAsArrayBuffer(file);
    }

    function loadSampleCsvIntoPreview() {
      state.csvFileName = 'beispiel-rechnungen-zahlungslotse.csv';
      state.csvPreviewRows = parseCsvAndBuildPreview(getSampleCsvText());
      renderCsvModalBody();
    }

    function downloadSampleCsv() {
      const blob = new Blob([getSampleCsvText()], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'zahlungslotse-beispiel.csv';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast('Muster-CSV heruntergeladen.', 'info');
    }

    function confirmCsvImport() {
      const validRows = state.csvPreviewRows.filter(r => r.valid);
      if (validRows.length === 0) return;

      const created = validRows.map((r, i) => ({
        id: 'inv-csv-' + Date.now() + '-' + i,
        invoiceNumber: r.invoiceNumber,
        customer: r.customer,
        email: r.email,
        amount: r.amount,
        issueDate: r.issueDateIso,
        dueDate: r.dueDateIso,
        paid: false,
        paidDate: null,
        lastReminderStep: 0
      }));

      state.invoices = [...created, ...state.invoices];
      saveInvoices();
      addActivityLog(`Demo-Import: ${created.length} geprüfte CSV-Rechnung(en) übernommen`);
      closeModal();
      showToast(`${created.length} gültige Rechnung(en) in die Demo übernommen.`, 'success');
      render();
    }

    function handleInterestFormSubmit(event) {
      event.preventDefault();
      const form = event.target;
      const name = form.name.value.trim();
      const company = form.company.value.trim();
      const step = form.step.value;
      const willingness = form.willingness.value;
      const volume = form.volume.value.trim() || 'Keine Angabe';
      const contactNote = form.contactNote.value.trim() || 'Keine Angabe';
      const notes = form.notes.value.trim() || 'Keine zusätzlichen Anmerkungen';

      const errors = [];
      if (!name) errors.push('Bitte geben Sie Ihren Namen an.');
      if (!company) errors.push('Bitte geben Sie Ihren Betrieb bzw. Ihr Unternehmen an.');

      const feedbackEl = document.getElementById('interest-form-feedback');
      if (errors.length > 0) {
        feedbackEl.innerHTML = `
          <div class="rounded-xl bg-red-50 border border-red-200 p-4 text-sm text-red-900 space-y-1">
            <p class="font-semibold">Bitte Pflichtfelder prüfen:</p>
            <ul class="list-disc list-inside">${errors.map(e => `<li>${escapeHtml(e)}</li>`).join('')}</ul>
          </div>
        `;
        return;
      }

      const briefLines = [
        'Unverbindliche Rückmeldung zur ZahlungsLotse-Präsentationsdemo',
        '--------------------------------------------------------------',
        `Name: ${name}`,
        `Unternehmen / Betrieb: ${company}`,
        `Gewünschter nächster Schritt: ${step}`,
        `Einschätzung zur Zahlungsbereitschaft: ${willingness}`,
        `Rechnungen pro Monat (ca.): ${volume}`,
        `Kontakt- / Gesprächshinweis: ${contactNote}`,
        `Anmerkungen: ${notes}`,
        '',
        'Hinweis: Dieser Entwurf wurde lokal in der Präsentationsdemo erstellt (keine automatische Übertragung).'
      ];
      const briefText = briefLines.join('\n');
      state.lastGeneratedBrief = briefText;

      state.signals = [
        {
          id: 'sig-' + Date.now(),
          name,
          company,
          step,
          willingness,
          createdAt: formatDateTimeGerman(new Date())
        },
        ...state.signals
      ].slice(0, 15);
      saveSignals();

      if (CONTACT_EMAIL && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(CONTACT_EMAIL.trim())) {
        const subject = encodeURIComponent(`Rückmeldung zur ZahlungsLotse-Demo – ${company}`);
        const bodyEncoded = encodeURIComponent(briefText);
        window.location.href = `mailto:${CONTACT_EMAIL.trim()}?subject=${subject}&body=${bodyEncoded}`;
        feedbackEl.innerHTML = `
          <div class="rounded-xl bg-emerald-50 border border-emerald-200 p-4 text-sm text-emerald-950">
            Entwurf erstellt und Ihr E-Mail-Programm (falls eingerichtet) für <strong>${escapeHtml(CONTACT_EMAIL)}</strong> aufgerufen. Eine Kopie liegt unten lokal in diesem Browser bereit.
          </div>
        `;
      } else {
        feedbackEl.innerHTML = `
          <div class="rounded-xl bg-blue-50 border border-blue-200 p-4 text-sm text-blue-950">
            <strong>Unverbindlicher Demo-Entwurf erstellt:</strong> Es wurden keine Daten an einen Server gesendet. Sie finden den Entwurf direkt darunter und können ihn kopieren oder als lokale Notiz in diesem Browser behalten.
          </div>
        `;
      }

      showToast('Unverbindlicher Gesprächs- und Interessensentwurf erstellt.', 'success');
      render();
    }

    function copyLastBrief() {
      if (!state.lastGeneratedBrief) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(state.lastGeneratedBrief)
          .then(() => showToast('Entwurf in die Zwischenablage kopiert.', 'success'))
          .catch(() => showToast('Kopieren nicht automatisch möglich – bitte Text manuell markieren.', 'info'));
      } else {
        showToast('Bitte den Entwurfstext manuell markieren und kopieren.', 'info');
      }
    }

                         <th class="px-4 py-3.5">Rechnungsnummer</th>
                         <th class="px-4 py-3.5">Kunde (Beispiel)</th>
                         <th class="px-4 py-3.5 text-right">Betrag</th>
                         <th class="px-4 py-3.5">Rechnungsdatum</th>
                         <th class="px-4 py-3.5">Fälligkeitsdatum</th>
                         <th class="px-4 py-3.5">Status</th>
                         <th class="px-4 py-3.5 text-right">Demo-Aktionen</th>
                       </tr>
                     </thead>
                     <tbody class="divide-y divide-slate-100">
                       ${filtered.map(inv => {
                         const status = getInvoiceStatus(inv);
                         return `
                           <tr class="hover:bg-slate-50/70">
                             <td class="px-4 py-4 font-medium text-slate-900 whitespace-nowrap">
                               <div>${escapeHtml(inv.invoiceNumber)}</div>
                               ${inv.lastReminderStep > 0 ? `<div class="text-xs text-brand-800 font-normal mt-0.5">Stufe ${inv.lastReminderStep} simuliert</div>` : ''}
                             </td>
                             <td class="px-4 py-4">
                               <div class="font-medium text-slate-900">${escapeHtml(inv.customer)}</div>
                               <div class="text-xs text-slate-500">${escapeHtml(inv.email)}</div>
                             </td>
                             <td class="px-4 py-4 text-right font-semibold text-slate-900 whitespace-nowrap">${formatCurrency(inv.amount)}</td>
                             <td class="px-4 py-4 text-slate-600 whitespace-nowrap">${formatGermanDate(inv.issueDate)}</td>
                             <td class="px-4 py-4 text-slate-800 font-medium whitespace-nowrap">${formatGermanDate(inv.dueDate)}</td>
                             <td class="px-4 py-4 whitespace-nowrap">
                               <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold border ${status.badgeClass}">
                                 <span class="w-1.5 h-1.5 rounded-full ${status.dotClass}"></span>
                                 ${escapeHtml(status.label)}
                               </span>
                             </td>
                             <td class="px-4 py-4 text-right whitespace-nowrap">
                               <div class="inline-flex items-center justify-end gap-1.5">
                                 <button type="button" onclick="toggleInvoicePaid('${escapeHtml(inv.id)}')" class="px-2.5 py-2 min-h-[36px] rounded-lg border border-slate-200 bg-white text-xs font-medium text-slate-700 hover:bg-slate-100">
                                   ${inv.paid ? 'Als offen setzen' : 'Als bezahlt markieren'}
                                 </button>
                                 ${!inv.paid ? `
                                   <button type="button" onclick="openReminderModal('${escapeHtml(inv.id)}')" class="px-3 py-2 min-h-[36px] rounded-lg bg-brand-700 text-xs font-semibold text-white hover:bg-brand-800">
                                     Vorschau / Sim.
                                   </button>
                                 ` : ''}
                               </div>
                             </td>
                           </tr>
                         `;
                       }).join('')}
                     </tbody>
                   </table>
                 </div>

                 <div class="lg:hidden divide-y divide-slate-200">
                   ${filtered.map(inv => {
                     const status = getInvoiceStatus(inv);
                     return `
                       <div class="p-4 space-y-3">
                         <div class="flex items-start justify-between gap-2">
                           <div>
                             <p class="text-xs font-semibold text-slate-500">${escapeHtml(inv.invoiceNumber)}</p>
                             <h3 class="font-bold text-slate-900 text-base">${escapeHtml(inv.customer)}</h3>
                           </div>
                           <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold border shrink-0 ${status.badgeClass}">
                             <span class="w-1.5 h-1.5 rounded-full ${status.dotClass}"></span>
                             ${escapeHtml(status.label)}
                           </span>
                         </div>

                         <div class="grid grid-cols-2 gap-2 text-xs bg-slate-50 rounded-xl p-3 border border-slate-100">
                           <div><span class="text-slate-500 block">Betrag</span><strong class="text-slate-900 text-sm">${formatCurrency(inv.amount)}</strong></div>
                           <div><span class="text-slate-500 block">Fällig am</span><strong class="text-slate-900 text-sm">${formatGermanDate(inv.dueDate)}</strong></div>
                           <div><span class="text-slate-500 block">Rechnungsdatum</span><span class="text-slate-700">${formatGermanDate(inv.issueDate)}</span></div>
                           <div><span class="text-slate-500 block">Demo-Stand</span><span class="text-slate-700">${inv.lastReminderStep > 0 ? `Stufe ${inv.lastReminderStep} simuliert` : 'Noch keine'}</span></div>
                         </div>

                         <div class="flex flex-col sm:flex-row gap-2 pt-1">
                           <button type="button" onclick="toggleInvoicePaid('${escapeHtml(inv.id)}')" class="flex-1 px-3 py-2.5 min-h-[42px] rounded-xl border border-slate-300 bg-white text-xs font-semibold text-slate-800 hover:bg-slate-50">
                             ${inv.paid ? 'Als offen setzen' : 'Als bezahlt markieren'}
                           </button>
                           ${!inv.paid ? `
                             <button type="button" onclick="openReminderModal('${escapeHtml(inv.id)}')" class="flex-1 px-3 py-2.5 min-h-[42px] rounded-xl bg-brand-700 text-xs font-semibold text-white hover:bg-brand-800">
                               Vorschau / Sim.
                             </button>
                           ` : ''}
                         </div>
                       </div>
                     `;
                   }).join('')}
                 </div>
               </div>`
          }
        </div>
      `;
    }

    function renderFilterChip(key, label) {
      const active = state.filterStatus === key;
      return `
        <button
          type="button"
          onclick="setFilterStatus('${key}')"
          class="px-3.5 py-2 min-h-[40px] rounded-xl text-xs sm:text-sm font-medium transition ${
            active
              ? 'bg-brand-700 text-white'
              : 'bg-slate-100 text-slate-700 hover:bg-slate-200/80'
          }"
        >
          ${escapeHtml(label)}
        </button>
      `;
    }

    function setFilterStatus(key) {
      state.filterStatus = key;
      render();
    }

    function updateSearchQuery(val) {
      const el = document.getElementById('invoice-search');
      const pos = el ? el.selectionStart : val.length;
      state.searchQuery = val;
      render();
      const input = document.getElementById('invoice-search');
      if (input) {
        input.focus();
        input.setSelectionRange(pos, pos);
      }
    }

    function resetFilterAndSearch() {
      state.filterStatus = 'all';
      state.searchQuery = '';
      render();
    }

    function toggleAddInvoiceForm() {
      state.showAddInvoiceForm = !state.showAddInvoiceForm;
      render();
    }

    function renderReminderPlanTab() {
      const previewInvoice = state.invoices.find(i => !i.paid) || state.invoices[0];
      const activePreviewStage =
        state.stages.find(s => s.id === state.selectedStageIdForPreview) || state.stages[0];
      const previewSubject = renderTemplate(activePreviewStage.subject, previewInvoice, DEFAULT_COMPANY_NAME);
      const previewBody = renderTemplate(activePreviewStage.body, previewInvoice, DEFAULT_COMPANY_NAME);

      return `
        <div class="space-y-6">
          <div>
            <h1 class="text-2xl sm:text-3xl font-bold text-slate-900">Erinnerungsplan (Demo)</h1>
            <p class="text-sm text-slate-600 mt-1">
              Testen Sie, wie Zeitpunkte vor oder nach Fälligkeit sowie Textvorlagen für unterschiedliche Stufen wirken.
            </p>
          </div>

          <div class="rounded-xl bg-amber-50 border border-amber-200 px-4 py-3 text-xs sm:text-sm text-amber-950">
            <strong>Hinweis:</strong> Textvorlagen sind unverbindliche Formulierungsbeispiele in der Demo und stellen keine Rechtsberatung dar.
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            <div class="lg:col-span-7 space-y-4">
              ${state.stages.map(stage => {
                const timingLabel = stage.timingType === 'before' ? 'Tage VOR Fälligkeit' : 'Tage NACH Fälligkeit';
                return `
                  <div class="card-elevated p-5 sm:p-6 space-y-4">
                    <div class="flex items-start justify-between gap-3">
                      <div>
                        <h2 class="text-base sm:text-lg font-bold text-slate-900">${escapeHtml(stage.title)}</h2>
                        <p class="text-xs text-slate-500 mt-0.5">
                          Aktuell: <strong>${Math.max(0, Number(stage.daysOffset) || 0)} ${timingLabel}</strong> · ${stage.enabled ? '<span class="text-emerald-800 font-semibold">Aktiv</span>' : '<span class="text-slate-500">Deaktiviert</span>'}
                        </p>
                      </div>

                      <label class="inline-flex items-center cursor-pointer gap-2 min-h-[40px] select-none">
                        <input
                          type="checkbox"
                          ${stage.enabled ? 'checked' : ''}
                          onchange="updateStageEnabled(${stage.id}, this.checked)"
                          class="sr-only peer"
                        />
                        <div class="w-11 h-6 bg-slate-200 peer-focus:ring-2 peer-focus:ring-brand-200 rounded-full peer peer-checked:bg-brand-700 relative transition after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-5"></div>
                        <span class="text-xs font-semibold text-slate-700">${stage.enabled ? 'An' : 'Aus'}</span>
                      </label>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label for="stage-days-${stage.id}" class="block text-xs font-semibold text-slate-700 mb-1">
                          Anzahl Tage (${stage.timingType === 'before' ? 'vor Fälligkeit' : 'nach Fälligkeit'})
                        </label>
                        <input
                          id="stage-days-${stage.id}"
                          type="number"
                          min="0"
                          max="180"
                          value="${Number(stage.daysOffset) || 0}"
                          onchange="updateStageDays(${stage.id}, this.value)"
                          class="w-full rounded-xl border border-slate-300 bg-white px-3.5 py-2 min-h-[42px] text-sm text-slate-900"
                        />
                      </div>
                      <div>
                        <label for="stage-timing-${stage.id}" class="block text-xs font-semibold text-slate-700 mb-1">
                          Zeitpunkt
                        </label>
                        <select
                          id="stage-timing-${stage.id}"
                          onchange="updateStageTiming(${stage.id}, this.value)"
                          class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 min-h-[42px] text-sm text-slate-900"
                        >
                          <option value="before" ${stage.timingType === 'before' ? 'selected' : ''}>Tage VOR Fälligkeit</option>
                          <option value="after" ${stage.timingType === 'after' ? 'selected' : ''}>Tage NACH Fälligkeit</option>
                        </select>
                      </div>
                    </div>

                    <div>
                      <label for="stage-body-${stage.id}" class="block text-xs font-semibold text-slate-700 mb-1">
                        Nachrichtenvorlage
                      </label>
                      <textarea
                        id="stage-body-${stage.id}"
                        rows="5"
                        oninput="updateStageBody(${stage.id}, this.value)"
                        class="w-full rounded-xl border border-slate-300 bg-white px-3.5 py-2.5 text-sm text-slate-900 leading-relaxed focus:border-brand-700 focus:ring-2 focus:ring-brand-100"
                      >${escapeHtml(stage.body)}</textarea>
                    </div>

                    <div class="flex flex-wrap items-center justify-between gap-2 text-xs text-slate-500">
                      <span>Platzhalter: <code class="text-slate-700">{Kunde}</code>, <code class="text-slate-700">{Rechnungsnummer}</code>, <code class="text-slate-700">{Betrag}</code>, <code class="text-slate-700">{Fälligkeitsdatum}</code>, <code class="text-slate-700">{Firmenname}</code></span>
                      <button type="button" onclick="selectPreviewStage(${stage.id})" class="font-semibold text-brand-700 hover:text-brand-800">
                        In Vorschau anzeigen →
                      </button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <div class="lg:col-span-5 card-elevated p-6 lg:sticky lg:top-24 space-y-4">
              <div class="flex items-center justify-between gap-2">
                <div>
                  <h2 class="text-lg font-bold text-slate-900">Live-Vorschau</h2>
                  <p class="text-xs text-slate-500">Mit Beispieldaten ersetzt</p>
                </div>
                <div class="flex gap-1">
                  ${state.stages.map(s => `
                    <button
                      type="button"
                      onclick="selectPreviewStage(${s.id})"
                      class="px-2.5 py-1.5 min-h-[34px] rounded-lg text-xs font-semibold ${
                        activePreviewStage.id === s.id
                          ? 'bg-brand-700 text-white'
                          : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                      }"
                    >
                      Stufe ${s.id}
                    </button>
                  `).join('')}
                </div>
              </div>

              <div class="rounded-xl bg-slate-50 border border-slate-200 p-3 text-xs text-slate-600">
                Beispiel-Rechnung: <strong>${escapeHtml(previewInvoice.invoiceNumber)}</strong> (${escapeHtml(previewInvoice.customer)}, ${formatCurrency(previewInvoice.amount)}, fällig am ${formatGermanDate(previewInvoice.dueDate)})
              </div>

              <div>
                <p class="text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Betreff</p>
                <div class="rounded-xl border border-slate-200 bg-white px-3.5 py-2.5 text-sm font-medium text-slate-900">
                  ${escapeHtml(previewSubject)}
                </div>
              </div>

              <div>
                <p class="text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Nachricht</p>
                <pre id="preview-body" class="whitespace-pre-wrap font-sans rounded-xl border border-slate-200 bg-slate-50 p-4 text-sm text-slate-800 leading-relaxed">${escapeHtml(previewBody)}</pre>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function updateStageEnabled(stageId, enabled) {
      const st = state.stages.find(s => s.id === stageId);
      if (!st) return;
      st.enabled = Boolean(enabled);
      saveStages();
      render();
    }

    function updateStageDays(stageId, rawDays) {
      const st = state.stages.find(s => s.id === stageId);
      if (!st) return;
      const parsed = Math.max(0, Math.min(365, parseInt(rawDays, 10) || 0));
      st.daysOffset = parsed;
      saveStages();
      render();
    }

    function updateStageTiming(stageId, timingType) {
      const st = state.stages.find(s => s.id === stageId);
      if (!st) return;
      st.timingType = timingType === 'before' ? 'before' : 'after';
      saveStages();
      render();
    }

    function updateStageBody(stageId, newBody) {
      const st = state.stages.find(s => s.id === stageId);
      if (!st) return;
      st.body = newBody;
      saveStages();
      if (state.selectedStageIdForPreview === stageId) {
        const previewInvoice = state.invoices.find(i => !i.paid) || state.invoices[0];
        const pre = document.getElementById('preview-body');
        if (pre && previewInvoice) {
          pre.textContent = renderTemplate(st.body, previewInvoice, DEFAULT_COMPANY_NAME);
        }
      }
    }

    function selectPreviewStage(stageId) {
      state.selectedStageIdForPreview = stageId;
      render();
    }

    // Gemeinsamer Footer ohne falsche/leere Admin-Links oder Fake-Formulare
    function renderCommonFooter() {
      return `
        <footer class="bg-white border-t border-slate-200 mt-auto">
          <div class="max-w-6xl mx-auto px-4 sm:px-6 py-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 text-xs text-slate-600">
            <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
              <span class="font-bold text-slate-900">ZahlungsLotse</span>
              <span>·</span>
              <span>Unverbindliche Präsentations- & Validierungsdemo (keine Rechtsberatung, kein Live-Betrieb)</span>
            </div>
            <div class="flex flex-wrap items-center gap-x-4 gap-y-1">
              <button type="button" onclick="openInfoModal('Demo-Status & Hinweise')" class="hover:text-slate-900 underline underline-offset-4">
                Demo-Hinweise
              </button>
              <button type="button" onclick="openInfoModal('Impressum & Datenschutz (offen)')" class="hover:text-slate-900 underline underline-offset-4">
                Impressum & Datenschutz (vor Veröffentlichung ergänzen)
              </button>
            </div>
          </div>
        </footer>
      `;
    }

    function openInfoModal(title) {
      openModal(`
        <div class="bg-white rounded-2xl border border-slate-200 max-w-lg w-full shadow-2xl overflow-hidden">
          <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
            <h3 id="modal-title" class="text-lg font-bold text-slate-900">${escapeHtml(title)}</h3>
            <button type="button" data-close-modal onclick="closeModal()" aria-label="Dialog schließen" class="p-2 rounded-lg text-slate-600 hover:bg-slate-200/70 min-h-[40px] min-w-[40px] flex items-center justify-center font-semibold">✕</button>
          </div>
          <div class="p-6 text-sm text-slate-700 space-y-3 leading-relaxed">
            <p class="rounded-xl bg-amber-50 border border-amber-200 p-3.5 text-amber-950">
              <strong>Präsentations- & Validierungsdemo:</strong> Diese Seite dient ausschließlich zur Veranschaulichung und Gesprächsführung mit Unternehmen. Es finden keine echten Zahlungen, Verträge oder Nachrichtenversände statt.
            </p>
            <p>
              <strong>Noch offene Angaben vor einer öffentlichen Bereitstellung:</strong> Vollständige Anbieter-/Impressumsangaben, eine Datenschutzerklärung für den Live-Betrieb sowie gegebenenfalls eine angebundene Kontakt- oder Backend-Lösung sind bisher noch nicht hinterlegt.
            </p>
            <p class="text-xs text-slate-500">
              Keine Rechts- oder Steuerberatung.
            </p>
          </div>
          <div class="px-6 py-4 bg-slate-50 border-t border-slate-200 flex justify-end">
            <button type="button" onclick="closeModal()" class="px-4 py-2.5 min-h-[42px] rounded-xl bg-brand-700 text-white text-sm font-semibold hover:bg-brand-800">
              Schließen
            </button>
          </div>
        </div>
      `);
    }

    function render() {
      const appEl = document.getElementById('app');
      if (!appEl) return;

      if (state.route === '/demo') {
        appEl.innerHTML = renderDemoApp();
      } else {
        appEl.innerHTML = renderLandingPage();
      }
    }

    loadState();
    syncRouteFromHash();
    render();
  </script>
</body>
</html>
